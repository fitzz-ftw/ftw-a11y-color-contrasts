<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./static/style.css" />
    <script type="importmap">
      {
        "imports": {
          "culori": "./node_modules/culori/src/index.js"
        }
      }
    </script>
    <script type="module" src="./index.js"></script>
    <title>Test Color Contrast Picker</title>
  </head>
  <body>
    <main>
      <h1>Color Selector</h1>

      <a11y-control
        class="small"
        id="a11y-ctrl"
        for="ayy1 ayy3 ayy4 ayy6 ayy7 ayy10"
      ></a11y-control>

      <!-- Ergebnis-Container aufgeteilt nach EU-/WCAG-Stufen -->
      <div class="results-grid">
        <!-- AA Stufe -->
        <section class="level-section" id="section-aa">
          <h2>WCAG 2.1 / EU-Richtlinie: Stufe AA (Minimum)</h2>
          <div class="result-container">
            <div class="result-row">
              <a11y-card
                id="ayy1"
                mode="darker"
                font-mode="normal"
                wcga-mode="AA"
              ></a11y-card>
            </div>
          </div>
        </section>
        <!-- AAA Stufe -->
        <section class="level-section" id="section-aaa">
          <h2>WCAG 2.1 / EU-Richtlinie: Stufe AAA (Erweitert)</h2>
          <h3>Dunklere Farben</h3>
          <div class="result-container">
            <div class="result-row">
          </div>
          <h3>Hellere Farben</h3>
          <div class="result-container">
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
