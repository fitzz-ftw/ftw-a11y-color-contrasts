name: 'Test & Coverage'

on: 
  pull_request:
  push:
    branches: [main] # Falls du Coverage auch direkt auf dem Main-Branch sehen möchtest

jobs:
  test:
    runs-on: ubuntu-latest
     
    permissions:
      contents: read
      pull-requests: write # Notwendig, damit die Action den Kommentar in den PR schreiben kann

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests & Coverage
      run: npm run test:coverage # Dein dedizierter CI-Befehl

    - name: Report Coverage
      if: always() 
      uses: davelosert/vitest-coverage-report-action@v2
      with:
        vite-config-path: './config/vite.config.mjs'
        coverage-path: './docs/html/coverage/coverage-summary.json' # Pfad zur Coverage-Datei
        threshold-icons: "{0: '🔴', 80: '🟠', 90: '🟢'}"