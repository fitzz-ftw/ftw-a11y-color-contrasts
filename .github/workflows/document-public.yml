name: 'Deploy Public Documentation'

on:
  release:
    types: [published] # Läuft z.B. bei neuen Releases
  workflow_dispatch:   # Ermöglicht den manuellen Start über die GitHub-Oberfläche

# Setzt die notwendigen Berechtigungen für GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert parallele Deployments, die sich ins Quere kommen
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Build & Deploy Documentation'
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Documentation
        run: npm run docs:public # Führt dein TypeDoc-Skript mit dem Smart-Docs-Plugin aus

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/publicapi' # Passe diesen Pfad an dein in typedoc.json definiertes 'out'-Verzeichnis an

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4